<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>HTML Email Converter</title>
  <style>
    /* ==========================================================================
       Microsoft Fluent Design System Tokens & Base Styles
       ========================================================================== */
    :root {
      --color-primary: #0078d4;
      --color-primary-hover: #005a9e;
      --color-primary-pressed: #004578;
      --color-primary-light: #eff6fc;
      --color-bg: #f3f2f1;
      --color-card-bg: #ffffff;
      --color-card-border: #edebe9;
      --color-border-subtle: #d2d0ce;
      --color-border-strong: #8a8886;
      --color-text-main: #242424;
      --color-text-secondary: #605e5c;
      --color-text-muted: #8a8886;
      --color-error: #a4262c;
      --color-error-bg: #fde7e9;
      --color-error-border: #f8c2c5;
      --color-success: #107c10;
      --color-success-bg: #dff6dd;
      --color-success-border: #bde7bd;
      --font-family-base: "Segoe UI", -apple-system, BlinkMacSystemFont, "Roboto", "Helvetica Neue", Arial, sans-serif;
      --font-family-mono: Consolas, "Courier New", Courier, monospace;
      --shadow-card: 0 1.6px 3.6px 0 rgba(0, 0, 0, 0.132), 0 0.3px 0.9px 0 rgba(0, 0, 0, 0.108);
      --shadow-card-elevated: 0 3.2px 7.2px 0 rgba(0, 0, 0, 0.132), 0 0.6px 1.8px 0 rgba(0, 0, 0, 0.108);
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-family-base);
      font-size: 14px;
      line-height: 1.5;
      color: var(--color-text-main);
      background-color: var(--color-bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ==========================================================================
       Header Banner
       ========================================================================== */
    .app-header {
      background: linear-gradient(135deg, #005a9e 0%, #0078d4 100%);
      color: #ffffff;
      padding: 24px 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-icon {
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .header-icon svg {
      width: 24px;
      height: 24px;
      fill: #ffffff;
    }

    .header-text h1 {
      margin: 0 0 4px 0;
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.3px;
      line-height: 1.2;
    }

    .header-text p {
      margin: 0;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.9);
    }

    /* ==========================================================================
       Main Layout Containers
       ========================================================================== */
    .app-main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 20px 48px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, 1.15fr);
      gap: 24px;
      align-items: start;
    }

    /* ==========================================================================
       Cards
       ========================================================================== */
    .card {
      background: var(--color-card-bg);
      border: 1px solid var(--color-card-border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-card);
      padding: 24px;
      transition: box-shadow 0.2s ease;
    }

    .card:hover {
      box-shadow: var(--shadow-card-elevated);
    }

    .card-header {
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--color-card-border);
      padding-bottom: 14px;
      flex-wrap: wrap;
    }

    .card-title {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      color: var(--color-text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title svg {
      width: 20px;
      height: 20px;
      fill: var(--color-primary);
    }

    .card-actions-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #107c10;
      background-color: #dff6dd;
      padding: 3px 9px;
      border-radius: 12px;
      border: 1px solid #bde7bd;
      user-select: none;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #107c10;
      box-shadow: 0 0 0 0 rgba(16, 124, 16, 0.7);
      animation: pulseDot 2s infinite;
    }

    @keyframes pulseDot {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 124, 16, 0.7);
      }
      70% {
        transform: scale(1);
        box-shadow: 0 0 0 5px rgba(16, 124, 16, 0);
      }
      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 124, 16, 0);
      }
    }

    .btn-sample {
      background: transparent;
      border: 1px solid var(--color-primary);
      color: var(--color-primary);
      border-radius: var(--radius-sm);
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: var(--transition);
    }

    .btn-sample:hover {
      background-color: var(--color-primary-light);
    }

    /* ==========================================================================
       Form Controls & Inputs
       ========================================================================== */
    .form-group {
      margin-bottom: 20px;
    }

    .form-group:last-of-type {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      color: var(--color-text-main);
      margin-bottom: 6px;
    }

    .form-label .required-indicator {
      color: var(--color-error);
      margin-left: 2px;
      font-weight: bold;
    }

    /* Validation Errors */
    .error-feedback {
      color: var(--color-error);
      font-size: 12px;
      font-weight: 600;
      margin-top: 5px;
      min-height: 18px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .error-feedback:empty {
      display: none;
    }

    .error-feedback svg {
      width: 14px;
      height: 14px;
      fill: var(--color-error);
      flex-shrink: 0;
    }

    /* ==========================================================================
       Rich Text Editor & Toolbar
       ========================================================================== */
    .editor-wrapper {
      border: 1px solid var(--color-border-strong);
      border-radius: var(--radius-sm);
      background: #ffffff;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      display: flex;
      flex-direction: column;
    }

    .editor-wrapper:focus-within {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 2px rgba(0, 120, 212, 0.25);
    }

    .editor-wrapper.is-invalid {
      border-color: var(--color-error);
      background-color: #fffdfd;
    }

    .editor-wrapper.is-invalid:focus-within {
      box-shadow: 0 0 0 2px rgba(164, 38, 44, 0.25);
    }

    .editor-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 6px 8px;
      background-color: #faf9f8;
      border-bottom: 1px solid var(--color-card-border);
      border-radius: var(--radius-sm) var(--radius-sm) 0 0;
    }

    .toolbar-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 32px;
      min-width: 32px;
      padding: 0 8px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      color: var(--color-text-main);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: var(--transition);
    }

    .toolbar-btn:hover {
      background-color: #edebe9;
      border-color: var(--color-border-subtle);
    }

    .toolbar-btn:active,
    .toolbar-btn.is-active {
      background-color: #e1dfdd;
      border-color: var(--color-primary);
      color: var(--color-primary-pressed);
    }

    .toolbar-btn:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 1px;
    }

    .toolbar-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .toolbar-divider {
      width: 1px;
      height: 20px;
      background-color: var(--color-border-subtle);
      margin: 6px 2px;
    }

    .editor-content {
      min-height: 300px;
      max-height: 480px;
      padding: 14px;
      overflow-y: auto;
      outline: none;
      line-height: 1.6;
      color: var(--color-text-main);
      font-size: 14px;
      position: relative;
    }

    .editor-content[data-placeholder].is-empty::before,
    .editor-content[data-placeholder]:empty::before {
      content: attr(data-placeholder);
      color: var(--color-text-muted);
      pointer-events: none;
      position: absolute;
      left: 14px;
      top: 14px;
    }

    /* Standard content styling inside editor */
    .editor-content p {
      margin: 0 0 10px 0;
    }
    .editor-content p:last-child {
      margin-bottom: 0;
    }
    .editor-content ul, .editor-content ol {
      margin: 0 0 10px 0;
      padding-left: 24px;
    }
    .editor-content li {
      margin-bottom: 4px;
    }
    .editor-content a {
      color: var(--color-primary);
      text-decoration: underline;
    }

    /* ==========================================================================
       Action Buttons & Button Group
       ========================================================================== */
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      border-radius: var(--radius-sm);
      cursor: pointer;
      border: 1px solid transparent;
      user-select: none;
      transition: var(--transition);
      line-height: 20px;
    }

    .btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .btn:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }

    .btn-primary {
      background-color: var(--color-primary);
      color: #ffffff;
      border-color: var(--color-primary);
    }

    .btn-primary:hover {
      background-color: var(--color-primary-hover);
      border-color: var(--color-primary-hover);
    }

    .btn-primary:active {
      background-color: var(--color-primary-pressed);
      border-color: var(--color-primary-pressed);
    }

    .btn-secondary {
      background-color: #ffffff;
      color: var(--color-text-main);
      border-color: var(--color-border-strong);
    }

    .btn-secondary:hover {
      background-color: #f3f2f1;
      border-color: var(--color-text-main);
    }

    .btn-secondary:active {
      background-color: #edebe9;
    }

    /* ==========================================================================
       Status & Feedback Messages
       ========================================================================== */
    .status-area {
      margin-top: 16px;
      min-height: 24px;
    }

    .status-banner {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      animation: fadeIn 0.2s ease-in-out;
    }

    .status-banner.is-visible {
      display: flex;
    }

    .status-banner.success {
      background-color: var(--color-success-bg);
      color: var(--color-success);
      border: 1px solid var(--color-success-border);
    }

    .status-banner.success svg {
      fill: var(--color-success);
    }

    .status-banner.error {
      background-color: var(--color-error-bg);
      color: var(--color-error);
      border: 1px solid var(--color-error-border);
    }

    .status-banner.error svg {
      fill: var(--color-error);
    }

    .status-banner.info {
      background-color: var(--color-primary-light);
      color: var(--color-primary);
      border: 1px solid #c7e0f4;
    }

    .status-banner.info svg {
      fill: var(--color-primary);
    }

    .status-banner svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    /* ==========================================================================
       Right Side: Live Preview Panel
       ========================================================================== */
    .preview-card {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .preview-wrapper {
      position: relative;
      flex: 1;
      min-height: 560px;
      background-color: #faf9f8;
      border: 1px solid var(--color-card-border);
      border-radius: var(--radius-sm);
      overflow-x: auto;
      overflow-y: hidden;
      display: flex;
      flex-direction: column;
    }

    .preview-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      height: 100%;
      min-height: 560px;
      color: var(--color-text-secondary);
    }

    .preview-placeholder-icon {
      width: 64px;
      height: 64px;
      background: #edebe9;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      color: var(--color-text-muted);
    }

    .preview-placeholder-icon svg {
      width: 32px;
      height: 32px;
      fill: currentColor;
    }

    .preview-placeholder h3 {
      margin: 0 0 8px 0;
      font-size: 16px;
      font-weight: 600;
      color: var(--color-text-main);
    }

    .preview-placeholder p {
      margin: 0;
      max-width: 340px;
      font-size: 13px;
      line-height: 1.5;
    }

    .preview-iframe {
      width: 100%;
      min-width: 690px;
      height: 640px;
      border: none;
      background: #ffffff;
      display: block;
    }

    /* ==========================================================================
       Bottom Section: Generated HTML Source Panel
       ========================================================================== */
    .output-section {
      margin-top: 24px;
      transition: all 0.3s ease;
    }

    .output-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--color-card-border);
      padding-bottom: 16px;
      margin-bottom: 16px;
    }

    .html-source-textarea {
      width: 100%;
      min-height: 300px;
      padding: 14px 16px;
      font-family: var(--font-family-mono);
      font-size: 13px;
      line-height: 1.5;
      color: #1b1b1b;
      background-color: #faf9f8;
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-sm);
      resize: vertical;
      outline: none;
      white-space: pre;
      tab-size: 2;
    }

    .html-source-textarea:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 2px rgba(0, 120, 212, 0.25);
    }

    /* Utility helper classes */
    .hidden {
      display: none !important;
    }

    /* Screen reader only */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ==========================================================================
       Responsive Media Queries
       ========================================================================== */
    @media (max-width: 992px) {
      .grid-container {
        grid-template-columns: 1fr;
      }
      .preview-wrapper {
        min-height: 480px;
      }
      .preview-placeholder {
        min-height: 480px;
      }
      .preview-iframe {
        height: 560px;
      }
    }

    @media (max-width: 640px) {
      .app-header {
        padding: 18px 16px;
      }
      .header-icon {
        width: 38px;
        height: 38px;
      }
      .header-text h1 {
        font-size: 20px;
      }
      .header-text p {
        font-size: 13px;
      }
      .app-main {
        padding: 16px 12px 32px;
      }
      .card {
        padding: 16px;
      }
      .card-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      .btn-group {
        flex-direction: column;
        width: 100%;
      }
      .btn-group .btn {
        width: 100%;
      }
      .editor-toolbar {
        gap: 2px;
        padding: 4px;
      }
      .toolbar-btn {
        padding: 0 6px;
      }
      .editor-content {
        min-height: 220px;
      }
      .output-card-header {
        flex-direction: column;
        align-items: stretch;
      }
      .output-card-header .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- ==========================================================================
       Application Header Banner
       ========================================================================== -->
  <header class="app-header" role="banner">
    <div class="header-inner">
      <div class="header-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
        </svg>
      </div>
      <div class="header-text">
        <h1>HTML Email Converter</h1>
        <p>Create clean, email-safe HTML templates from rich text and preview them in real time.</p>
      </div>
    </div>
  </header>

  <!-- ==========================================================================
       Main Application Area
       ========================================================================== -->
  <main class="app-main" id="main-content">
    
    <!-- Top Row: Editor (Left) & Preview (Right) -->
    <div class="grid-container">

      <!-- Left Column: Form & Editor -->
      <section class="card" aria-labelledby="composerHeading">
        <div class="card-header">
          <h2 id="composerHeading" class="card-title">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
            </svg>
            Email Details
          </h2>
          <div class="card-actions-top">
            <span class="live-indicator" title="Real-time sync enabled">
              <span class="live-dot"></span> Live Sync
            </span>
            <button type="button" id="loadSampleBtn" class="btn-sample" title="Load sample email content">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
              </svg>
              Load Sample
            </button>
          </div>
        </div>

        <form id="emailForm" novalidate onsubmit="return false;">

          <!-- Rich Text Editor Field -->
          <div class="form-group">
            <label id="bodyLabel" class="form-label">
              Email Body <span class="required-indicator" aria-hidden="true">*</span>
            </label>
            
            <div id="editorWrapper" class="editor-wrapper">
              <!-- Toolbar -->
              <div class="editor-toolbar" role="toolbar" aria-label="Email body formatting">
                <button 
                  type="button" 
                  class="toolbar-btn" 
                  data-command="bold" 
                  title="Bold (Ctrl+B)" 
                  aria-label="Bold"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M15.6 10.79c.97-.67 1.65-1.77 1.65-2.79 0-2.26-1.75-4-4-4H7v14h7.04c2.09 0 3.71-1.7 3.71-3.79 0-1.52-.86-2.82-2.15-3.42zM10 6.5h3c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5h-3v-3zm3.5 9H10v-3h3.5c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5z"/>
                  </svg>
                  <span class="sr-only">Bold</span>
                </button>

                <button 
                  type="button" 
                  class="toolbar-btn" 
                  data-command="italic" 
                  title="Italic (Ctrl+I)" 
                  aria-label="Italic"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M10 4v3h2.21l-3.42 8H6v3h8v-3h-2.21l3.42-8H18V4z"/>
                  </svg>
                  <span class="sr-only">Italic</span>
                </button>

                <button 
                  type="button" 
                  class="toolbar-btn" 
                  data-command="underline" 
                  title="Underline (Ctrl+U)" 
                  aria-label="Underline"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 17c3.31 0 6-2.69 6-6V3h-2.5v8c0 1.93-1.57 3.5-3.5 3.5S8.5 12.93 8.5 11V3H6v8c0 3.31 2.69 6 6 6zm-7 2v2h14v-2H5z"/>
                  </svg>
                  <span class="sr-only">Underline</span>
                </button>

                <div class="toolbar-divider" aria-hidden="true"></div>

                <button 
                  type="button" 
                  class="toolbar-btn" 
                  data-command="insertUnorderedList" 
                  title="Bulleted List" 
                  aria-label="Bulleted list"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">

        var selection = window.getSelection();

            if (node === emailBodyEditor) {
              savedRange = selection.getRangeAt(0);
              return;
            }
            node = node.parentNode;
          }
        }
      }

      function restoreSelection() {
        if (savedRange && window.getSelection) {
          var selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(savedRange);
        }
      }

      // --- Security: Escape HTML characters ---
      function escapeHTML(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, function (match) {
          switch (match) {
            case '&': return '&amp;';
            case '<': return '&lt;';
            case '>': return '&gt;';
            case '"': return '&quot;';
            case "'": return '&#39;';
            default: return match;
          }
        });
      }

      // --- Security: Robust Sanitization Function for Email Body ---
      function sanitizeHTML(rawHtml) {
        if (!rawHtml) return '';

        var template = document.createElement('template');
        template.innerHTML = rawHtml;
        var content = template.content;

        // 1. Remove dangerous, interactive, script-executable elements
        // Keep seismic-variable and custom placeholders intact
        var tagsToRemove = [
          'script', 'iframe', 'object', 'embed',
          'form', 'input', 'select', 'textarea',
          'option', 'optgroup', 'fieldset', 'legend', 'datalist', 'output',
          'style', 'link', 'meta', 'base', 'applet', 'video', 'audio'
        ];

        tagsToRemove.forEach(function (tag) {
          var els = content.querySelectorAll(tag);
          for (var i = 0; i < els.length; i++) {
            els[i].remove();
          }
        });

        // 2. Scan all elements to remove dangerous attributes & event handlers
        var allElements = content.querySelectorAll('*');
        allElements.forEach(function (el) {
          var attrsToRemove = [];

          for (var i = 0; i < el.attributes.length; i++) {
            var attr = el.attributes[i];
            var attrName = attr.name.toLowerCase();
            var rawVal = attr.value;
            // Normalize value: remove whitespace & control chars to prevent evasions like 'java\tscript:'
            var normVal = rawVal.replace(/[\x00-\x20\s]+/g, '').toLowerCase();

            // Strip all event handlers (onclick, onload, onerror, etc.)
            if (attrName.startsWith('on')) {
              attrsToRemove.push(attr.name);
            }
            // Strip javascript: and vbscript: URIs anywhere
            else if (normVal.startsWith('javascript:') || normVal.startsWith('vbscript:')) {
              attrsToRemove.push(attr.name);
            }
            // Strip dangerous data URIs on navigation/links
            else if ((attrName === 'href' || attrName === 'src') && normVal.startsWith('data:') && !normVal.startsWith('data:image/')) {
              attrsToRemove.push(attr.name);
            }
          }

          attrsToRemove.forEach(function (name) {
            el.removeAttribute(name);
          });

          // 3. Format and sanitize hyperlinks for email
          if (el.tagName.toLowerCase() === 'a') {
            var href = el.getAttribute('href');
            if (href) {
              var cleanHref = href.trim().toLowerCase();
              // Only allow safe protocols: http:, https:, mailto:, tel:
              if (
                !cleanHref.startsWith('http://') &&
                !cleanHref.startsWith('https://') &&
                !cleanHref.startsWith('mailto:') &&
                !cleanHref.startsWith('tel:')
              ) {
                el.removeAttribute('href');
              } else {
                el.setAttribute('target', '_blank');
                el.setAttribute('rel', 'noopener noreferrer');
                // Preserve custom button styles if styled
                if (!el.style.backgroundColor && !el.getAttribute('bgcolor')) {
                  el.style.color = '#0067b8';
                  el.style.textDecoration = 'underline';
                }
              }
            }
          }
        });

        return template.innerHTML;
      }

      // --- Real-Time Sync: Reflect Changes Immediately in Live Preview & HTML Source ---
      function syncRealTimePreview() {

          previewIframe.srcdoc = '';
          previewIframe.classList.add('hidden');
          previewEmptyState.classList.remove('hidden');
          htmlOutput.value = '';
          outputCard.classList.add('hidden');
          return;
        }

        var bodyHtml = emailBodyEditor.innerHTML;
        var generatedEmailHTML = buildEmailTemplate(bodyHtml);

        // Update Live Preview immediately
        previewIframe.srcdoc = generatedEmailHTML;
        previewEmptyState.classList.add('hidden');
        previewIframe.classList.remove('hidden');

        htmlOutput.value = generatedEmailHTML;
        outputCard.classList.remove('hidden');

        // Automatically clear any previous validation error
        editorWrapper.classList.remove('is-invalid');
        bodyError.innerHTML = '';
      }

        if (realTimeSyncTimer) {
          clearTimeout(realTimeSyncTimer);
          realTimeSyncTimer = null;

          syncRealTimePreview();
        } else {
          realTimeSyncTimer = setTimeout(syncRealTimePreview, 60);
        }

        statusText.textContent = message;

          statusTimeout = setTimeout(function () {
            statusMessage.className = 'status-banner';
            statusText.textContent = '';
          }, 5000);

        '<p>Sinceramente,<br>[[Sender.FullName]]<br>[[Sender.Title]]<br>[[Sender.Email]]</p>'
      ].join('');

      loadSampleBtn.addEventListener('click', function () {
        emailBodyEditor.innerHTML = sampleContentHTML;
        editorWrapper.classList.remove('is-invalid');
        bodyError.innerHTML = '';
        updateEditorPlaceholder();
        triggerRealTimeSync(true);
        setStatus('Sample email loaded and rendered in real time.', 'info');
        emailBodyEditor.focus();
      });

      // --- Rich Text Editor Formatting Commands ---
      // Use mousedown preventDefault so editor selection is preserved
      var toolbarButtons = document.querySelectorAll('.toolbar-btn[data-command]');
      toolbarButtons.forEach(function (button) {
        button.addEventListener('mousedown', function (e) {
          e.preventDefault();
        });

        button.addEventListener('click', function () {
          var cmd = button.getAttribute('data-command');
          document.execCommand(cmd, false, null);
          emailBodyEditor.focus();
          updateEditorPlaceholder();
          updateToolbarActiveStates();
          saveSelection();
          triggerRealTimeSync(true);
        });
      });

      // Update active states on cursor position change
      function updateToolbarActiveStates() {
        toolbarButtons.forEach(function (button) {
          var cmd = button.getAttribute('data-command');
          try {
            if (document.queryCommandState(cmd)) {
              button.classList.add('is-active');
            } else {
              button.classList.remove('is-active');
            }
          } catch (e) {
            // Some commands may throw if not applicable
          }
        });
      }

      emailBodyEditor.addEventListener('keyup', function () {
        updateToolbarActiveStates();
        saveSelection();
        updateEditorPlaceholder();
      });

      emailBodyEditor.addEventListener('mouseup', function () {
        updateToolbarActiveStates();
        saveSelection();
      });

      // --- Hyperlink Insertion Handler ---
      linkBtn.addEventListener('mousedown', function (e) {
        e.preventDefault();
      });

      linkBtn.addEventListener('click', function () {
        saveSelection();
        var selection = window.getSelection();
        var selectedText = selection ? selection.toString() : '';

        var enteredUrl = prompt('Enter a web address (e.g. https://example.com):', 'https://');
        if (enteredUrl === null) {
          emailBodyEditor.focus();
          return;
        }

        enteredUrl = enteredUrl.trim();
        if (!enteredUrl || enteredUrl === 'https://' || enteredUrl === 'http://') {
          emailBodyEditor.focus();
          return;
        }

        // Prepend https:// if protocol is omitted
        if (
          !/^https?:\/\//i.test(enteredUrl) &&
          !/^mailto:/i.test(enteredUrl) &&
          !/^tel:/i.test(enteredUrl)
        ) {
          enteredUrl = 'https://' + enteredUrl;
        }

        restoreSelection();
        emailBodyEditor.focus();

        if (!selectedText) {
          // If no text was highlighted, insert the link with the URL text
          document.execCommand('insertHTML', false, '<a href="' + escapeHTML(enteredUrl) + '">' + escapeHTML(enteredUrl) + '</a>&nbsp;');
        } else {
          document.execCommand('createLink', false, enteredUrl);
        }

        updateEditorPlaceholder();
        saveSelection();
        triggerRealTimeSync(true);

        if (!isEditorEmpty(emailBodyEditor)) {
          editorWrapper.classList.remove('is-invalid');
          bodyError.innerHTML = '';
        }
      });

      // --- Generate HTML Button Action ---
      generateBtn.addEventListener('click', function () {
        var isBodyValid = validateEmailBody();

        if (!isBodyValid) {
          setStatus('Please enter the email body before generating HTML.', 'error');
          emailBodyEditor.focus();
          return;
        }

        triggerRealTimeSync(true);
        setStatus('HTML template generated matching exact specification.', 'success');

        // Smooth scroll to preview if on mobile
        if (window.innerWidth <= 992) {
          previewIframe.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      });

      // --- Copy HTML to Clipboard Action ---
      copyBtn.addEventListener('click', async function () {
        var code = htmlOutput.value;
        if (!code) {
          setStatus('No HTML generated yet to copy.', 'error');
          return;
        }

        var copySucceeded = false;

        // Attempt Modern Clipboard API
        if (navigator.clipboard && window.isSecureContext) {
          try {
            await navigator.clipboard.writeText(code);
            copySucceeded = true;
          } catch (err) {
            copySucceeded = false;
          }
        }

        // Fallback for browsers or contexts without clipboard API
        if (!copySucceeded) {
          try {
            htmlOutput.focus();
            htmlOutput.select();
            htmlOutput.setSelectionRange(0, 999999);
            copySucceeded = document.execCommand('copy');
            if (window.getSelection) {
              window.getSelection().removeAllRanges();
            }
          } catch (fallbackErr) {
            copySucceeded = false;
          }
        }

        if (copySucceeded) {
          setStatus('HTML copied to clipboard.', 'success');
          // Visual button feedback
          copyBtnText.textContent = 'Copied!';
          copyBtn.style.borderColor = 'var(--color-success)';
          copyBtn.style.color = 'var(--color-success)';
          setTimeout(function () {
            copyBtnText.textContent = 'Copy HTML';
            copyBtn.style.borderColor = '';
            copyBtn.style.color = '';
          }, 2000);
        } else {
          setStatus('Could not copy automatically. Please select the HTML code and press Ctrl+C.', 'error');
        }
      });

      // --- Reset Button Action ---
      resetBtn.addEventListener('click', function () {
        // Clear Email Body
        emailBodyEditor.innerHTML = '';
        editorWrapper.classList.remove('is-invalid');
        bodyError.innerHTML = '';
        updateEditorPlaceholder();

        // Clear Preview
        previewIframe.srcdoc = '';
        previewIframe.classList.add('hidden');
        previewEmptyState.classList.remove('hidden');

        // Clear Generated HTML Source & Hide Output Card
        htmlOutput.value = '';
        outputCard.classList.add('hidden');

        // Clear Status Messages
        setStatus('', '');

        // Reset toolbar button active states
        toolbarButtons.forEach(function (btn) {
          btn.classList.remove('is-active');
        });

        // Focus back on Email Body Editor
        emailBodyEditor.focus();
      });

      // Initial state
      updateEditorPlaceholder();

    })();
  </script>
</body>
</html>
